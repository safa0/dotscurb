# dotagents (getsentry/dotagents) global config: yours, kept in your dotfiles repo. Things listed here are on in
# EVERY project and for every agent. Add with `dotagents add …` / `dotagents mcp add …`; for one project only, run
# `dotagents --project add …` in that repo instead.
version = 1
agents = ["claude", "cursor", "codex", "pi", "opencode"]

[[skills]]
name = "dotagents"
source = "getsentry/dotagents"

[[mcp]]
name = "context7"
url = "https://mcp.context7.com/mcp"
